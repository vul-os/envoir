# Build and test gate for the Envoir reference implementation.
#
# This repo had no CI. Hundreds of tests and six machine-checked formal proofs
# existed and nothing ran them on a push — which is how a committed conformance
# vector came to assert the opposite of spec §1.1 while every local run stayed
# green. (The figure this line used to quote, "1462 tests", predated 620a68c
# carving the gateway out. The JS (31) and Go (49) counts that used to be quoted
# here belong to the KOTVA repo now — see the note where those steps used to be.)
#
# The first version of this file was itself structurally red, in three ways that
# all shared one root cause — it checked out ONLY this repo, while the test suite
# reaches out of the worktree in two directions:
#
#   1. A sync gate HARD-FAILS when the sibling KOTVA spec repo is absent, so
#      `cargo test` could never have gone green. KOTVA is now checked out beside
#      this repo. (The gate that motivated this was
#      `crates/dmtap-sync-wasm/tests/native_trace.rs`, which has since MOVED to
#      the KOTVA repo along with the crate it proves; the reason the checkout is
#      still needed is `conformance-runner`, which reads the frozen vectors and
#      the suite catalog from there.)
#   2. `cargo {build,test} --workspace` overrides `default-members` and therefore
#      pulls in `crates/dmtap-postage-patala`, which path-depends on the sibling
#      `patala` repo. The root manifest's promise that "plain cargo build never
#      pulls patala in" is true of `cargo build`; `--workspace` is exactly the
#      spelling that breaks it. The gate below builds the DEFAULT members, which
#      is the set this repo claims to build standalone, and the optional patala
#      adapter is tested in its own job that checks patala out.
#   3. `cargo tree --workspace 2>/dev/null | grep -q patala` was asserting the
#      postage seam stays provider-agnostic. With patala absent, cargo tree
#      FAILS, the error goes to /dev/null, the grep matches nothing, and the step
#      prints "default build has no patala dependency" — a gate that passes by
#      not running. It now fails closed on a cargo-tree error and asserts against
#      the default members, which is the set the claim is actually about.
#
# Nothing here may be "green because it did nothing". Every step that could
# silently no-op (a glob matching no test files, a vector file that is not there)
# asserts a coverage COUNT, not just an exit code.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  # The KOTVA revision this repo's conformance cross-reference is calibrated
  # against. PINNED rather than tracking `main` on purpose: the catalog and the
  # vector files live in another repo that is pushed to independently, and an
  # unrelated push there must not turn this repo's PRs red. The `spec-drift` job
  # below tracks KOTVA `main` non-blockingly so the drift is still visible.
  #
  # To bump: move this SHA, run `cargo test --locked` with that revision checked
  # out at ../kotva, and land both together.
  #
  # NOTE, and it is a real one: this is NOT the revision the Rust dependency
  # resolves to. `Cargo.toml` pins `kotva-core`/`kotva-mail` at tag `core-v0.2.0`
  # (a4a6ca5), while the conformance catalog this suite reads is ahead of that
  # tag. Running the suite against the TAG's catalog FAILS — DMTAP-SUITE-03 there
  # references `suite_reject_0x05`, a vector that exists only in this repo's
  # `vectors.json`, because that file already tracks KOTVA main. The two pins want
  # reconciling in KOTVA (a `core-v0.3.0` tag cut from main would do it); until
  # then this SHA is the honest description of what is actually tested.
  KOTVA_REF: 585a8b171424dff44b20da4fb1876aee3aeb1631

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envoir
    env:
      # Read by all THREE surfaces of the parity proof (the Rust harnesses via
      # `conformance_runner::spec_repo_dir`, `test/vectors.test.mjs` via
      # process.env, `bindings/go/vectors_test.go` via os.Getenv), so one
      # variable places the spec checkout for every one of them.
      KOTVA_DIR: ${{ github.workspace }}/kotva
    steps:
      - uses: actions/checkout@v4
        with:
          path: envoir

      # The sibling spec repo. The Rust/JS/Go harnesses all resolve it as
      # `../kotva` by default, so this path is also what a developer checkout
      # looks like — `KOTVA_DIR` above just makes it explicit.
      #
      # `token`: falls back to the job's own GITHUB_TOKEN, which is enough while
      # KOTVA is public. Set a `KOTVA_TOKEN` secret (a PAT or app token with read
      # access) if it is ever made private; without it the checkout FAILS loudly
      # rather than the suite quietly skipping every cross-repo proof.
      - uses: actions/checkout@v4
        with:
          repository: vul-os/kotva
          ref: ${{ env.KOTVA_REF }}
          path: kotva
          token: ${{ secrets.KOTVA_TOKEN || github.token }}

      - name: The spec checkout is really there (fail closed)
        run: |
          missing=0
          for f in conformance/suite.json \
                   conformance/vectors/vectors.json \
                   conformance/vectors/pub_vectors.json \
                   conformance/vectors/pubsub_vectors.json \
                   conformance/vectors/sync_vectors.json; do
            if [ ! -f "$KOTVA_DIR/$f" ]; then
              echo "::error::missing $KOTVA_DIR/$f"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "::error::the KOTVA checkout is incomplete. Every cross-repo proof in this run" \
                 "would either hard-fail or silently skip; refusing to continue and report green."
            exit 1
          fi
          echo "KOTVA @ $(git -C "$KOTVA_DIR" rev-parse HEAD)"
          echo "suite cases: $(grep -c '"id":' "$KOTVA_DIR/conformance/suite.json")"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: envoir

      # DEFAULT MEMBERS, not `--workspace`. See the header: `--workspace` drags in
      # `crates/dmtap-postage-patala` and with it the sibling `patala` repo, which
      # is an OPTIONAL payment-provider adapter and deliberately not part of the
      # standalone build. The `patala-adapter` job below covers that crate.
      - name: Build (default members — the standalone set)
        run: cargo build --locked

      - name: Test (default members — the standalone set)
        run: cargo test --locked

      # --- the cross-surface parity proof MOVED OUT OF THIS REPO --------------
      # It used to live here: build the WASM binding, run the JS half, run the Go
      # half, each asserting its own pass count so a glob that matched nothing
      # could not report success. All three surfaces have moved to the KOTVA repo
      # WITH the implementation they prove — `crates/dmtap-sync{,-wasm}` are now
      # `kotva-sync{,-wasm}` and `bindings/go` is
      # `github.com/vul-os/kotva/bindings/go`. The gate moved with them, into
      # kotva's own ci.yml; it is not deleted, and this comment exists so nobody
      # concludes from its absence here that the proof was dropped.
      #
      # What REMAINS this repo's job is the consumer side, and it still runs
      # below: `cargo test -p conformance-runner --test sync_vectors` drives the
      # 24 frozen SYNC.md §10 vectors through `kotva-sync` as envoir consumes it.
      # The KOTVA checkout above is still required for exactly that.

      # RE-MEASURED 2026-07-30. The block that used to sit here said "~2600 rustfmt
      # diffs and ~79 clippy findings" and marked BOTH steps `continue-on-error`.
      # Those figures predated 620a68c (which carved envoir to node-only and
      # deleted most of the code they were measured over), so they were re-counted
      # against HEAD on rustc/clippy 1.94.0 before touching either step:
      #
      #   clippy, `--all-targets` over the default members:  26 findings (was ~79)
      #   rustfmt, this repo's own files only:             1701 hunks / 113 files
      #
      # The two numbers moved in opposite directions and so the two steps get
      # opposite treatment. Do not "tidy" them back into one policy.
      #
      # CLIPPY IS NOW A REAL GATE. All 26 findings were fixed (mostly
      # `doc_lazy_continuation` from `+`/`>` starting a doc line, plus a handful of
      # mechanical suggestions); one `#[allow]` remains, at
      # `dmtap-mls/src/committer.rs::adopt_confirmed`, with its reasoning written
      # at the site. `cargo clippy --all-targets -- -D warnings` exits 0 at HEAD,
      # so `continue-on-error` is gone: a new lint fails the build.
      - name: Clippy (blocking — 0 findings at HEAD)
        run: cargo clippy --all-targets -- -D warnings

      # RUSTFMT IS STILL NOT A GATE, and this is the honest reason, not deferral.
      #
      # 1. The debt is real and large: 1701 hunks across 113 files. Gating today
      #    still means landing that reformat first, which is the blame-destroying
      #    commit the previous note rightly refused.
      # 2. It is a STYLE MISMATCH more than sloppiness, so "just run cargo fmt" is
      #    a decision, not a cleanup. This tree writes compact single-line struct
      #    literals and ~110-column lines; rustfmt's defaults explode them. Measured
      #    over this repo's files: 2908 hunks at rustfmt defaults, 2444 at
      #    `max_width = 110`, 1171 at `max_width = 110` + `use_small_heuristics =
      #    "Max"`. No config makes the tree clean, so adopting rustfmt means
      #    adopting its layout, and that choice belongs to a human.
      # 3. CONSEQUENTLY A RATCHET WOULD BE WRONG TOO: new code written in this
      #    tree's house style ADDS rustfmt hunks, so a "count must not grow" gate
      #    would redden correct commits.
      #
      # What IS fixed here: the step used to be unable to fail for ANY reason,
      # including rustfmt not being installed — the invisible-skip pathology this
      # file's header is otherwise careful about. It now fails closed if rustfmt
      # cannot run or produces no output, and only the diff itself is tolerated.
      # It also scopes its report to THIS repo: `cargo fmt --all` reaches into path
      # dependencies, so it was silently reporting on the sibling KOTVA checkout as
      # well (1243 of the 2944 hunks it printed were kotva's, unfixable from here).
      - name: Format (reports; fails only if rustfmt cannot run)
        run: |
          # NOTE: no `pipefail` in this step on purpose. Every count below is a
          # `grep | wc` whose grep legitimately matches nothing on a clean tree, and
          # under pipefail that would fail the step for the one outcome we want most.
          #
          # Fail closed on a missing/broken component rather than "passing" the way a
          # continue-on-error step did, including when rustfmt was never installed.
          cargo fmt --version || {
            echo "::error::rustfmt is not available, so formatting was NOT checked"; exit 1; }

          # `|| true`: a nonzero exit here means "diffs exist", which is expected.
          cargo fmt --all -- --check > /tmp/fmt.txt 2>&1 || true
          if [ ! -s /tmp/fmt.txt ]; then
            echo "rustfmt reported no diffs at all. If that is real, this step can become a"
            echo "blocking gate — drop the tolerance and just run 'cargo fmt --all -- --check'."
            exit 0
          fi

          grep '^Diff in' /tmp/fmt.txt > /tmp/fmt-hunks.txt || true
          if [ ! -s /tmp/fmt-hunks.txt ]; then
            echo "::error::rustfmt produced output but no 'Diff in' lines. Its output format" \
                 "changed, so these counts would be meaningless: re-read this step."
            cat /tmp/fmt.txt | head -20
            exit 1
          fi

          # Only this repo's files. `cargo fmt --all` reaches into path dependencies,
          # so the sibling KOTVA checkout shows up here and cannot be fixed from a
          # commit in this repo.
          mine=$(grep -v "/kotva/" /tmp/fmt-hunks.txt | wc -l | tr -d ' ')
          theirs=$(grep -c "/kotva/" /tmp/fmt-hunks.txt || true)
          files=$(grep -v "/kotva/" /tmp/fmt-hunks.txt \
                  | sed 's/^Diff in //; s/:[0-9]*:$//' | sort -u | wc -l | tr -d ' ')
          echo "rustfmt: $mine hunks across $files of this repo's files (1701 / 113 measured at HEAD)"
          echo "rustfmt: $theirs hunks ignored — they belong to the sibling KOTVA checkout"
          grep -v "/kotva/" /tmp/fmt-hunks.txt | head -50
          echo "NOT A GATE: see the comment above this step for why, with the numbers."

      # The postage seam must stay provider-agnostic: the DEFAULT build carries no
      # payment provider at all. This is the one property the seam exists for, so
      # it is asserted rather than assumed.
      #
      # Note what changed: no `--workspace` (which would find the optional adapter
      # member and fail a build that is in fact agnostic), and no `2>/dev/null`
      # (which turned a cargo-tree ERROR into a silent pass). The tree is captured
      # once and its exit status checked, so an unresolvable manifest is a
      # failure, not a green tick.
      - name: Postage seam is provider-agnostic
        run: |
          if ! cargo tree > /tmp/tree.txt 2>/tmp/tree.err; then
            echo "::error::cargo tree failed, so the provider-agnostic property was NOT verified:"
            cat /tmp/tree.err
            exit 1
          fi
          if [ ! -s /tmp/tree.txt ]; then
            echo "::error::cargo tree produced no output — nothing was verified"; exit 1
          fi
          if grep -q patala /tmp/tree.txt; then
            echo "::error::default build pulled a payment provider — the seam is no longer agnostic"
            grep -n patala /tmp/tree.txt
            exit 1
          fi
          echo "default build has no patala dependency ($(wc -l < /tmp/tree.txt) tree lines scanned)"

  # The OPTIONAL patala-backed postage adapter (`crates/dmtap-postage-patala`).
  # `exclude`d from the workspace (NOT merely kept out of `default-members` — see
  # the root Cargo.toml, which is explicit that the distinction is the whole
  # point), because it path-depends on the sibling `patala` repo, so it needs its
  # own checkout. It does need testing, which is why the main job dropping
  # `--workspace` does not lose coverage — but only if the command below can
  # actually reach it.
  #
  # IT COULD NOT. This job ran `cargo test -p dmtap-postage-patala`, and `-p`
  # resolves against WORKSPACE MEMBERS; an `exclude`d directory is not one:
  #
  #   $ cargo test -p dmtap-postage-patala --locked
  #   error: package ID specification `dmtap-postage-patala` did not match any packages
  #
  # So the only job covering the optional adapter has been failing on argument
  # resolution rather than testing anything, and the comment above it asserted a
  # coverage that did not exist. `--manifest-path` is how you reach an excluded
  # crate. Measured after the change: 9 tests run and pass.
  patala-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envoir
    steps:
      - uses: actions/checkout@v4
        with:
          path: envoir
      - uses: actions/checkout@v4
        with:
          repository: vul-os/patala
          path: patala
          token: ${{ secrets.PATALA_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: envoir
      # Assert the COUNT as well as the exit status. `cargo test` on a crate whose
      # test targets all vanished exits 0 having run nothing, which is the failure
      # mode this suite has already shipped more than once.
      - name: Test the optional postage adapter
        run: |
          set -o pipefail
          cargo test --manifest-path crates/dmtap-postage-patala/Cargo.toml --locked \
            2>&1 | tee /tmp/patala-test.log
          ran=$(awk '/^test result: ok\./ {gsub(/;/,""); n+=$4} END {print n+0}' /tmp/patala-test.log)
          echo "postage adapter: $ran tests passed (9 at 2026-07-28)"
          if [ "$ran" -lt 9 ]; then
            echo "::error::only $ran adapter tests ran (expected >= 9). NOT VERIFIED: that the" \
                 "optional patala-backed postage provider still satisfies the dmtap-seam contract."
            exit 1
          fi

  # DRIFT DETECTOR, non-blocking by design. The `test` job pins KOTVA so an
  # unrelated push to the spec repo cannot redden this repo's PRs; this job runs
  # the same cross-reference against KOTVA `main` so that when the spec moves
  # ahead of what this implementation reproduces, it is VISIBLE in the checks
  # list rather than discovered months later. A red tick here means "go bump
  # KOTVA_REF and fix what that surfaces", never "this PR is broken".
  spec-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: envoir
    env:
      KOTVA_DIR: ${{ github.workspace }}/kotva
    steps:
      - uses: actions/checkout@v4
        with:
          path: envoir
      - uses: actions/checkout@v4
        with:
          repository: vul-os/kotva
          path: kotva
          token: ${{ secrets.KOTVA_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: envoir
      - name: Conformance cross-reference against KOTVA main
        run: |
          echo "KOTVA main @ $(git -C "$KOTVA_DIR" rev-parse HEAD) (pinned: $KOTVA_REF)"
          cargo test --locked -p conformance-runner
          cargo run --locked -p conformance-runner | tail -40

  # The JS surfaces — lint, typecheck, the published docs, and the client's
  # own unit tests.
  #
  # This job exists because these guards already existed and ran NOWHERE. A
  # gate that is never invoked by CI is indistinguishable from a gate that
  # cannot fail, and this suite has shipped that shape before: `docs:sync:check`
  # was written with a real dry-run path and a coverage-count assertion, and
  # then sat unreferenced by any workflow. Writing the guard is half the work;
  # wiring it into the run is the half that makes it a gate.
  #
  # `lint` and `typecheck:client` had the SAME problem, discovered while
  # adding the lint-config gate below: both scripts existed in package.json,
  # both ran clean locally, and neither was referenced by any workflow step —
  # `eslint .` and `tsc --noEmit -p client/tsconfig.json` could have gone red
  # on any push and CI would have stayed green throughout. Added here, ahead
  # of the gate that proves the lint config they run is itself real.
  #
  # No Rust, no KOTVA checkout: nothing here reads the spec repo, and adding a
  # dependency this job does not need is how a fast check becomes a slow one
  # nobody keeps green.
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envoir
    steps:
      - uses: actions/checkout@v4
        with:
          path: envoir
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint (client/console/superadmin/status buildless JS + client/test TS)
        run: npm run lint

      - name: Typecheck client/test against client/tsconfig.json
        run: npm run typecheck:client

      # Behavioural gate for the lint config itself: proves type-aware rules
      # actually resolve type information in client/test/**/*.ts (a config
      # can say recommendedTypeChecked and still not resolve types), that
      # typescript is pinned exactly with node_modules agreeing (this repo's
      # package.json had `^5.7.0` until today — a caret that would silently
      # resolve an untested major and break typescript-eslint entirely), a
      # real file-coverage floor, and — specific to this repo's buildless
      # surfaces — that no-undef fires on a typo'd global, the one static
      # defence client/console/superadmin/status have against that class of
      # bug.
      - name: Lint config gate (type-awareness, TS pin, coverage floor, no-undef)
        run: npm run check:lint-config

      # `docs/` is the single source of truth; `site/docs/*.md` is GENERATED
      # from it by scripts/sync-site-docs.mjs. Before that script existed, nine
      # files were byte-identical copies maintained by hand, so editing the
      # wrong one silently did nothing at all.
      #
      # --check is a true dry run (it never writes) and asserts a coverage
      # COUNT: it fails if it examined fewer pages than the published set, and
      # fails if it examined zero. Both matter — an exit code alone cannot tell
      # "everything is in sync" apart from "the glob matched nothing".
      - name: Published docs match their source (drift check)
        run: npm run docs:sync:check

      - name: Client unit tests
        run: npm run test:client

  # The landing page and docs are rendered in a real browser at eight viewports
  # in both colour schemes. None of what this catches survives a diff: a
  # stretched screenshot, an off-theme capture, body copy under 12px, an element
  # pushing the page sideways, a dead anchor, an unhighlighted code block.
  site-render:
    name: site/ renders correctly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          cd scripts
          npm install --silent
          npx --yes playwright install --with-deps chromium

      # Self-test first: it breaks each invariant on purpose and demands the
      # check notice. A gate that has stopped discriminating looks exactly like
      # one that passes, so a silent gate must fail the build.
      - name: Gate self-test
        run: node scripts/check-render.mjs --selftest

      - name: Render checks
        run: node scripts/check-render.mjs
