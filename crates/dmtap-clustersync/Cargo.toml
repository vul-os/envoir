[package]
name = "dmtap-clustersync"
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "DMTAP device-cluster sync (spec §5.6 / §18.6.3) — the ClusterSyncFrame/ClusterOp wire objects, range-based Merkle set-reconciliation, hash-chained journal backfill, and the OR-Set + HLC-LWW CRDT merge that converges an owner's personal device cluster with no primary and no central server"
repository = "https://example.invalid/envoir"

[dependencies]
# Every wire primitive this crate needs — the canonical §18.1 CBOR codec (Cv/Fields/encode/decode),
# content addressing (ContentId = BLAKE3-256, the suite hash), identity + DeviceCert membership
# authentication, and the DeniablePayload guard — is public API of core. This crate adds NO new
# third-party dependency: it is std + dmtap-core only.
dmtap-core = { workspace = true }

[dev-dependencies]
# The multi-author substrate generalization of the three CRDTs this crate is the §5.6 normative home
# of. Used ONLY by `tests/sync_parity.rs`, which proves the two agree op-for-op on the subset both
# cover — the "reuse" obligation discharged as an executable cross-check rather than as a type
# dependency (§5.6's `Hlc`/value type is the `device`-flavoured, unsigned-integer-only one; the
# substrate value type must additionally carry negative integers, §4.1 `ext-value`).
#
# The direction of this dev-dependency is deliberate and is the whole reason the test lives here:
# `dmtap-sync` is packaged to leave this repo, so nothing in it may point at an envoir-local crate.
# Nothing points back the other way, so there is no cycle.
dmtap-sync = { path = "../dmtap-sync" }
