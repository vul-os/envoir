# no-broker-dep:allow-file: comments explain the gateway service moved permanently out of this
# repository to the separate, external Ephor broker repo -- no service in
# this compose file runs or depends on ephor.

# Envoir self-host stack: the node (reference client — identity/mesh/mail-projection scaffold;
# NOT yet a production mail server). Read deploy/README.md before deploying this anywhere but a
# trusted LAN/loopback: several pieces below are honestly-labelled demo/seam behavior, not
# hardened self-host infrastructure.
#
# The legacy SMTP/IMAP/POP3 gateway is NOT built or run by this compose stack — it moved
# permanently out of this repository to the separate, external Ephor broker repo
# (https://github.com/vul-os/ephor, its `gateway` coordinator kind). If you want one, build
# `ephor-gateway` from that repo and run it as its own process/container, then point this node
# at it with ENVOIR_GATEWAY_BIN — see deploy/README.md.
#
# Build context is `..` (the repo root) because the node binary lives in the shared Cargo
# workspace and its Dockerfile needs the sibling workspace members — see deploy/Dockerfile.node.
#
# Usage:
#   cp deploy/.env.example deploy/.env   # then edit
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build -d
# or just run deploy/selfhost.sh from the repo root.

services:
  # -----------------------------------------------------------------------------------------
  # node — the reference DMTAP client (node/src/main.rs). Its default command, `run` (alias
  # `serve`), is the real long-running daemon (node/src/daemon.rs::serve): it loads the identity
  # keystore + durable outbound journal from $ENVOIR_DATA_DIR (the node-data volume below), binds
  # the mesh transport on $ENVOIR_NODE_BIND (default 0.0.0.0:4600 — Docker-reachable by default),
  # and serves until SIGINT/SIGTERM. IMAP/POP3/SMTP-submission are NOT part of this image — those
  # legacy client protocols live only on an externally-built gateway binary (see the top-of-file
  # note above), never in this crate (node/Cargo.toml).
  #
  # FIRST RUN: the daemon requires a keystore to already exist and refuses to start without one
  # (fail-closed, `DaemonError::NoKeystore`) — create it once before the first `up`:
  #   docker compose -f deploy/docker-compose.yml run --rm node init
  # (`init` persists a real keystore under the `node-data` volume — encrypted-at-rest if
  # ENVOIR_PASSPHRASE is set, else a clearly-marked plaintext-for-dev keystore; see
  # deploy/README.md "Keys, journal, and what's actually persisted" — and refuses to overwrite an
  # existing one unless ENVOIR_FORCE_INIT=1.)
  #
  # The JMAP client-sync surface, the Envoir Send HTTP API, DMTAP-PUB, and the Sync surface are
  # all opt-in (off by default) via ENVOIR_JMAP / ENVOIR_SEND_API / ENVOIR_PUB_SERVE /
  # ENVOIR_SYNC_SERVE — see deploy/.env.example and node/src/config.rs for the full var list. None
  # are published below; add a `ports:` entry (and the matching `ENVOIR_*_BIND=0.0.0.0:...`
  # override for anything that defaults to loopback, e.g. JMAP) if you enable and need to reach
  # one from outside the container.
  node:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
    image: envoir-node:local
    environment:
      - ENVOIR_DATA_DIR=/data
      # Uncomment and point at a gateway binary built from the separate Ephor repo, mounted or
      # otherwise reachable inside this container, if you want the node's `gateway`/`--gateway`
      # dispatch shim to hand off to one:
      # - ENVOIR_GATEWAY_BIN=/path/to/ephor-gateway
    ports:
      - "${NODE_MESH_PORT:-4600}:4600" # the mesh transport (ENVOIR_NODE_BIND)
    volumes:
      # Holds keystore.json (the identity, spec §1.2/§1.4) and journal.json (the durable outbound
      # retry queue, spec §19.3.3) — both real, written by `init`/`run` respectively.
      - node-data:/data
    restart: unless-stopped

volumes:
  node-data:
