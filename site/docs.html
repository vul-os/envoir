<!-- SOVEREIGNTY: zero network requests. marked + mermaid are vendored locally under -->
<!-- assets/vendor/; docs render straight from this repo's own docs/*.md. No CDN, no analytics. -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:dark;
  --font-serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Mono","Fira Code",Menlo,Consolas,"Liberation Mono",monospace;
  --bg-0:#0a0c11; --bg-1:#0e1118; --bg-2:#12151d; --bg-panel:#12141b;
  --line:rgba(238,241,247,.09); --line-strong:rgba(238,241,247,.16);
  --ink:#eef1f7; --ink-dim:#a5adc0; --ink-faint:#656d80;
  --accent-1:#4c4dff; --accent-2:#9a4dff; --accent-teal:#00e0c7;
  --accent-soft:rgba(124,77,255,.14);
  /* Lightened accent-1 for small text on dark backgrounds — plain
     --accent-1 fails WCAG AA at these sizes/backgrounds. */
  --accent-1-aa:#7374ff;
  --radius-sm:6px; --radius-md:12px; --radius-lg:16px;
  --container:1180px;
  --code-bg:#0b0d14;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg-0:#f4f2ee; --bg-1:#ffffff; --bg-2:#ebe8e1; --bg-panel:#ffffff;
  --line:rgba(20,20,25,.1); --line-strong:rgba(20,20,25,.18);
  --ink:#14151a; --ink-dim:#4c5266; --ink-faint:#82889b;
  --accent-1:#3a34e0; --accent-2:#7b2fd6; --accent-teal:#008b7d;
  --accent-soft:rgba(90,60,220,.1);
  /* Already >=4.5:1 on this theme's light backgrounds — just alias it. */
  --accent-1-aa:var(--accent-1);
  --code-bg:#f5f3ef;
}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);background:var(--bg-0);color:var(--ink-dim);
  line-height:1.65;-webkit-font-smoothing:antialiased;font-size:16px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(1000px 540px at 86% -8%,rgba(76,77,255,.08),transparent 60%),
  radial-gradient(820px 480px at -6% 6%,rgba(154,77,255,.05),transparent 55%)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.mono{font-family:var(--font-mono)}
.wrap{max-width:var(--container);margin:0 auto;padding:0 clamp(18px,4vw,40px)}
.skip-link{position:absolute;left:-9999px;top:0;background:var(--accent-1);color:#fff;
  padding:8px 14px;border-radius:0 0 8px 0;z-index:200}
.skip-link:focus{left:0}

/* Header */
.site-header{position:sticky;top:0;z-index:80;backdrop-filter:blur(12px);
  background:color-mix(in srgb,var(--bg-0) 78%,transparent);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;gap:16px;height:60px}
.vulos-back{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);
  font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);
  transition:color .15s;flex:none}
.vulos-back:hover{color:var(--accent-1)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.02em;
  color:var(--ink);padding-left:15px;border-left:1px solid var(--line)}
.brand img{width:26px;height:26px}
.nav-spacer{flex:1}
.nav-links{display:flex;align-items:center;gap:20px}
.nav-links a{color:var(--ink-dim);font-size:14px;transition:color .15s}
.nav-links a:hover{color:var(--ink)}
.nav-links a.here{color:var(--accent-1)}
.nav-links .gh{display:inline-flex;align-items:center;gap:5px}
.nav-links .gh svg{width:15px;height:15px}
.menu-btn{display:none;font-family:var(--font-mono);font-size:13px;color:var(--ink-dim);
  background:var(--bg-panel);border:1px solid var(--line-strong);border-radius:8px;
  padding:7px 12px;cursor:pointer;align-items:center;gap:7px}
.menu-btn:hover{color:var(--ink);border-color:var(--accent-1)}

/* Shell */
.shell{max-width:var(--container);margin:0 auto;padding:34px clamp(18px,4vw,40px) 80px;
  display:grid;grid-template-columns:250px minmax(0,1fr);gap:44px;align-items:start}

/* Sidebar */
.sidebar{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow-y:auto;
  border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg-panel);
  padding:14px;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.sidebar::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px}
.sidebar-head{padding:6px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.sidebar-head .eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent-1)}
.sidebar-head h3{font-size:16px;color:var(--ink);letter-spacing:-.01em;margin-top:4px}
.sidebar .grp{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.12em;color:var(--ink-faint);padding:14px 8px 5px}
.sidebar .grp:first-of-type{padding-top:4px}
.sidebar a{display:block;font-size:14px;color:var(--ink-dim);padding:7px 10px;
  border-radius:8px;letter-spacing:-.005em;line-height:1.4;border-left:2px solid transparent}
.sidebar a:hover{background:var(--accent-soft);color:var(--ink)}
.sidebar a.active{background:var(--accent-soft);color:var(--ink);border-left-color:var(--accent-1)}

/* Content */
.main{min-width:0}
.crumb{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;
  color:var(--ink-faint);margin-bottom:16px}
.crumb b{color:var(--accent-1);font-weight:500}
.md{font-size:16px;color:var(--ink-dim)}
.md>*:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4{color:var(--ink);line-height:1.25;letter-spacing:-.02em;scroll-margin-top:84px}
.md h1{font-family:var(--font-serif);font-size:2.1rem;margin:.1em 0 .7em;padding-bottom:.4em;
  border-bottom:1px solid var(--line);letter-spacing:-.01em}
.md h2{font-family:var(--font-serif);font-size:1.5rem;margin:2rem 0 .8em;padding-bottom:.3em;
  border-bottom:1px solid var(--line);letter-spacing:-.01em}
.md h3{font-size:1.18rem;margin:1.7em 0 .6em}
.md h4{font-size:1rem;margin:1.5em 0 .5em;color:var(--ink)}
.md h1 .anchor,.md h2 .anchor,.md h3 .anchor,.md h4 .anchor{opacity:0;margin-left:.4rem;
  color:var(--accent-1);font-weight:400;text-decoration:none;font-size:.8em}
.md h1:hover .anchor,.md h2:hover .anchor,.md h3:hover .anchor,.md h4:hover .anchor{opacity:.75}
.md p,.md li{color:var(--ink-dim)}
.md p{margin:.9em 0}
.md ul,.md ol{margin:.9em 0 .9em 1.4em}
.md li{margin:.35em 0}
.md li::marker{color:var(--ink-faint)}
.md a{color:var(--accent-1)}
.md a:hover{color:var(--accent-2);text-decoration:underline}
.md strong{color:var(--ink);font-weight:650}
.md em{color:var(--ink)}
.md code{font-family:var(--font-mono);font-size:.86em;background:var(--accent-soft);
  color:var(--ink);padding:.12em .42em;border-radius:5px}
.md pre{background:var(--code-bg);border:1px solid var(--line-strong);border-radius:11px;
  padding:16px 18px;overflow-x:auto;margin:1.1em 0}
.md pre code{background:none;color:var(--ink-dim);padding:0;font-size:.82rem;line-height:1.7}
.md blockquote{margin:1.1em 0;padding:.5em 1em;border-left:3px solid var(--accent-1);
  background:var(--accent-soft);color:var(--ink-dim);border-radius:0 8px 8px 0}
.md blockquote p{margin:.3em 0;color:inherit}
.md table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:.88rem;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line-strong);padding:9px 12px;text-align:left;vertical-align:top;color:var(--ink-dim)}
.md th{background:var(--bg-2);color:var(--ink);font-weight:600}
.md hr{border:none;border-top:1px solid var(--line);margin:2em 0}
.md img{max-width:100%;border-radius:10px;border:1px solid var(--line);margin:1.1em 0}
.md .mermaid{background:var(--bg-panel);border:1px solid var(--line);border-radius:11px;
  padding:18px;margin:1.2em 0;text-align:center;overflow-x:auto}
.err{font-family:var(--font-mono);font-size:.85rem;color:#ffb3a6;background:rgba(224,80,60,.08);
  border:1px solid rgba(224,80,60,.25);padding:14px 16px;border-radius:10px}
.loading{font-family:var(--font-mono);font-size:.82rem;color:var(--ink-faint)}

/* Scrim (mobile drawer backdrop) */
.scrim{display:none;position:fixed;inset:0;z-index:70;background:rgba(4,6,10,.55)}
.scrim.open{display:block}

/* Footer */
.site-footer{border-top:1px solid var(--line);padding:34px 0;margin-top:20px}
.footer-inner{max-width:var(--container);margin:0 auto;padding:0 clamp(18px,4vw,40px);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
.footer-left{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-faint)}
.footer-left img{width:20px;height:20px;opacity:.85}
.footer-links{display:flex;gap:22px;flex-wrap:wrap}
.footer-links a{font-size:13.5px;color:var(--ink-faint)}
.footer-links a:hover{color:var(--ink-dim)}

/* Mobile/tablet legibility + AA-contrast pass — scoped to <1280px so the
   >=1280px desktop view is unchanged. These labels were already >=10.5px
   (the tracked-micro-label floor) but their color failed WCAG AA
   (~3.3–3.8:1) against their real backgrounds; swap in the existing
   --ink-dim / --accent-1-aa tokens for ~5–9:1. */
@media(max-width:1279px){
  .vulos-back,
  .sidebar .grp,
  .crumb{ color:var(--ink-dim) }
  .sidebar-head .eyebrow,
  .crumb b{ color:var(--accent-1-aa) }
}

@media(max-width:860px){
  .nav-links{display:none}
  .menu-btn{display:inline-flex}
  .shell{grid-template-columns:1fr;gap:18px;padding-top:20px}
  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:75;width:min(310px,84vw);
    max-height:none;border-radius:0;border-left:none;border-top:none;border-bottom:none;
    transform:translateX(-102%);transition:transform .22s ease}
  .sidebar.open{transform:translateX(0)}
  .md h1{font-size:1.65rem}
  .md h2{font-size:1.3rem}
}
</style>
<script src="assets/vendor/marked.umd.js"></script>
<script src="assets/vendor/mermaid.min.js"></script>

<script>
// The site is served statically; docs render straight from this repo's own docs/*.md.
// Cross-links to docs in the sidebar become in-app navigation; links to any other
// repo file (READMEs, contracts, source) resolve to their real GitHub blob location,
// so no link on this page is ever dead — and no request ever leaves this origin.
const REPO_BLOB_BASE = 'https://github.com/vul-os/envoir/blob/main/';
const GROUPS = [
  {label:"Start", items:[
    {slug:"overview",              title:"Overview"},
    {slug:"getting-started",       title:"Getting started"},
    {slug:"naming",                title:"Naming"}
  ]},
  {label:"Concepts", items:[
    {slug:"architecture",          title:"Architecture"},
    {slug:"protocol",              title:"Protocol"},
    {slug:"privacy",               title:"Privacy & threat model"},
    {slug:"security",              title:"Security"}
  ]},
  {label:"Features", items:[
    {slug:"mail",                  title:"Mail"},
    {slug:"chat",                  title:"Chat"},
    {slug:"calendar",              title:"Calendar"},
    {slug:"contacts",              title:"Contacts"},
    {slug:"files",                 title:"Files"},
    {slug:"identity",              title:"Identity"},
    {slug:"transport-traceability",title:"Transport provenance"},
    {slug:"self-hosting",          title:"Self-hosting"}
  ]},
  {label:"Project", items:[
    {slug:"pwa-and-push",          title:"PWA & push"},
    {slug:"faq",                   title:"FAQ"},
    {slug:"roadmap",               title:"Roadmap"},
    {slug:"contributing",          title:"Contributing"}
  ]}
];
const DOCS = GROUPS.flatMap(g => g.items);
const bySlug = Object.fromEntries(DOCS.map(d => [d.slug, d]));

const content = document.getElementById('content');
const crumb = document.getElementById('crumb');
const sidebar = document.getElementById('sidebar');
const sidebarNav = document.getElementById('sidebar-nav');
const scrim = document.getElementById('scrim');
const menuBtn = document.getElementById('menuBtn');

// Build the grouped sidebar.
GROUPS.forEach(g => {
  const h = document.createElement('div'); h.className = 'grp'; h.textContent = g.label;
  sidebarNav.appendChild(h);
  g.items.forEach(d => {
    const a = document.createElement('a');
    a.dataset.slug = d.slug; a.href = '#' + d.slug; a.textContent = d.title;
    sidebarNav.appendChild(a);
  });
});

let mermaidReady = false;
try {
  const dark = document.documentElement.getAttribute('data-theme') !== 'light';
  mermaid.initialize({ startOnLoad:false, theme: dark ? 'dark' : 'default', securityLevel:'loose',
    themeVariables:{ fontFamily:'var(--font-sans)' } });
  mermaidReady = true;
} catch(e){}

if (window.marked && marked.setOptions) marked.setOptions({ gfm:true, breaks:false });

// GitHub-compatible heading slugs (does NOT collapse consecutive hyphens), so the
// hand-written "#messaging--files"-style fragments in the source docs still resolve.
function slugifyHeading(t){
  return t.toLowerCase().trim().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-');
}

function setActive(slug){
  sidebarNav.querySelectorAll('a').forEach(a => a.classList.toggle('active', a.dataset.slug === slug));
  const on = sidebarNav.querySelector('a.active');
  if (on && sidebar.scrollHeight > sidebar.clientHeight){
    const r = on.getBoundingClientRect(), sr = sidebar.getBoundingClientRect();
    if (r.top < sr.top || r.bottom > sr.bottom) on.scrollIntoView({ block:'center' });
  }
}

async function renderMermaid(){
  if(!mermaidReady) return;
  content.querySelectorAll('code.language-mermaid').forEach(code => {
    const div = document.createElement('div'); div.className = 'mermaid';
    div.textContent = code.textContent; code.closest('pre').replaceWith(div);
  });
  const nodes = content.querySelectorAll('.mermaid');
  if(nodes.length){ try { await mermaid.run({ nodes }); } catch(e){ console.warn('mermaid', e); } }
}

async function load(slug, heading){
  const doc = bySlug[slug] || DOCS[0];
  setActive(doc.slug);
  crumb.innerHTML = 'Docs <span style="opacity:.5">/</span> <b>' + doc.title + '</b>';
  content.innerHTML = '<span class="loading">Loading…</span>';
  try {
    const res = await fetch('docs/' + doc.slug + '.md', { cache:'no-cache' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const md = await res.text();
    content.innerHTML = marked.parse(md);

    // Local images live under docs/img/ — rewrite the source docs' "../img/x" refs.
    content.querySelectorAll('img').forEach(img => {
      const s = img.getAttribute('src') || '';
      if(/^https?:/i.test(s)) return;
      const m = s.match(/(?:\.\.\/)*(?:docs\/)?img\/(.+)$/);
      if(m) img.setAttribute('src', 'docs/img/' + m[1]);
    });

    // heading anchor ids + hover "#" links (using GitHub-compatible slugs)
    const seen = {};
    content.querySelectorAll('h1,h2,h3,h4').forEach(h => {
      let id = slugifyHeading(h.textContent);
      if(!id) return;
      if(seen[id] != null){ seen[id]++; id = id + '-' + seen[id]; } else seen[id] = 0;
      h.id = id;
      const a = document.createElement('a');
      a.className = 'anchor'; a.href = '#' + doc.slug + '#' + id; a.textContent = '#';
      a.setAttribute('aria-label', 'Link to this section');
      h.appendChild(a);
    });

    // Resolve cross-links: a .md whose basename is one of our own docs becomes in-app
    // navigation; anything else resolves to its real GitHub blob location.
    content.querySelectorAll('a[href]').forEach(a => {
      const h = a.getAttribute('href') || '';
      if(/^(https?:|#|mailto:)/i.test(h)) return;
      const m = h.match(/([A-Za-z0-9._-]+)\.md(#.*)?$/i);
      if(m){
        const target = bySlug[m[1].toLowerCase()];
        if(target){
          const frag = m[2] ? '#' + m[2].slice(1) : '';
          a.setAttribute('href', '#' + target.slug + frag);
          return;
        }
      }
      // Not one of our docs → point at the real file on GitHub (repo-root relative).
      const clean = h.replace(/^(\.\.?\/)+/, '');
      a.setAttribute('href', REPO_BLOB_BASE + clean);
      a.target = '_blank'; a.rel = 'noopener';
    });
    content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });

    await renderMermaid();

    if(heading){
      const el = document.getElementById(heading);
      if(el){ el.scrollIntoView(); return; }
    }
    window.scrollTo({ top:0 });
  } catch(err){
    content.innerHTML = '<div class="err">Could not load <code>' + doc.slug + '.md</code> — ' + err.message + '</div>';
  }
}

function closeDrawer(){ sidebar.classList.remove('open'); scrim.classList.remove('open'); menuBtn.setAttribute('aria-expanded','false'); }

function route(){
  const raw = (location.hash || '').replace(/^#/, '');
  const parts = raw.split('#');
  const slug = parts[0] || DOCS[0].slug;
  if(bySlug[slug]){
    load(slug, parts[1]);
  } else if(raw){
    const el = document.getElementById(raw);
    if(el) el.scrollIntoView(); else load(DOCS[0].slug);
  } else {
    load(DOCS[0].slug);
  }
  if(window.matchMedia('(max-width:860px)').matches) closeDrawer();
}

window.addEventListener('hashchange', route);
route();

menuBtn.addEventListener('click', () => {
  const open = !sidebar.classList.contains('open');
  sidebar.classList.toggle('open', open); scrim.classList.toggle('open', open);
  menuBtn.setAttribute('aria-expanded', String(open));
});
scrim.addEventListener('click', closeDrawer);
</script>
</body>
