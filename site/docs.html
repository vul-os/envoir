<script>
// Match the theme the visitor already chose on the landing page (same "envoir-theme" key,
// same data-theme attribute) so navigating in from index.html never flashes the wrong theme.
// With NO stored choice, follow the visitor's OS preference — this used to fall through to
// whatever <html> hardcoded ("dark"), so a light-preferring visitor was shown dark.
try {
  var s = localStorage.getItem('envoir-theme');
  var t = (s === 'light' || s === 'dark') ? s
        : (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', t);
} catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
</script>

<!-- SOVEREIGNTY: zero network requests. marked, mermaid, and highlight.js are vendored locally -->
<!-- under assets/vendor/; docs render straight from this repo's own docs/*.md (via site/docs/*.md, -->
<!-- generated by scripts/sync-site-docs.mjs). No CDN, no analytics, nothing fetched off-origin. -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:dark;
  --font-serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Mono","Fira Code",Menlo,Consolas,"Liberation Mono",monospace;
  --bg-0:#0a0912; --bg-1:#100e1b; --bg-2:#171524; --bg-panel:#12101d;
  --line:rgba(236,235,246,.09); --line-strong:rgba(236,235,246,.16);
  --ink:#ecebf6; --ink-dim:#a8a3c1; --ink-faint:#736e91;
  --indigo:#4c4dff; --violet:#9a4dff; --teal:#00e0c7;
  --accent-1:var(--indigo); --accent-2:var(--violet);
  --accent-soft:rgba(124,77,255,.14);
  /* Lightened accent-1 for small text on dark backgrounds — plain
     --accent-1 fails WCAG AA at these sizes/backgrounds. */
  --accent-1-aa:#7d7eff;
  --radius-sm:6px; --radius-md:12px; --radius-lg:16px;
  --container:1320px;
  --code-bg:#0b0a13;
  --good:#2fd39a; --warn:#ffbe5c; --bad:#ff6b6b; --legacy:#e0a45e;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg-0:#f0edf9; --bg-1:#ffffff; --bg-2:#e8e3f5; --bg-panel:#ffffff;
  --line:rgba(22,19,46,.1); --line-strong:rgba(22,19,46,.18);
  --ink:#16132e; --ink-dim:#4c4a66; --ink-faint:#83809b;
  --indigo:#3a34e0; --violet:#7b2fd6; --teal:#008b7d;
  --accent-1:var(--indigo); --accent-2:var(--violet);
  --accent-soft:rgba(90,60,220,.1);
  --accent-1-aa:var(--accent-1);
  --code-bg:#f5f3fb;
}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);background:var(--bg-0);color:var(--ink-dim);
  line-height:1.65;-webkit-font-smoothing:antialiased;font-size:16px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(1000px 540px at 86% -8%,color-mix(in srgb,var(--indigo) 9%,transparent),transparent 60%),
  radial-gradient(820px 480px at -6% 6%,color-mix(in srgb,var(--violet) 6%,transparent),transparent 55%)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.mono{font-family:var(--font-mono)}
.wrap{max-width:var(--container);margin:0 auto;padding:0 clamp(18px,4vw,40px)}
.skip-link{position:absolute;left:-9999px;top:0;background:var(--accent-1);color:#fff;
  padding:8px 14px;border-radius:0 0 8px 0;z-index:200}
.skip-link:focus{left:0}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}

/* Header */
.site-header{position:sticky;top:0;z-index:80;backdrop-filter:blur(12px);
  background:color-mix(in srgb,var(--bg-0) 78%,transparent);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;gap:16px;height:60px}
.vulos-back{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);
  transition:color .15s;flex:none}
.vulos-back:hover{color:var(--accent-1)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.02em;
  color:var(--ink);padding-left:15px;border-left:1px solid var(--line)}
.brand img{width:26px;height:26px}
.nav-spacer{flex:1}
.nav-links{display:flex;align-items:center;gap:18px}
.nav-links a{color:var(--ink-dim);font-size:14px;transition:color .15s}
.nav-links a:hover{color:var(--ink)}
.nav-links a.here{color:var(--accent-1)}
/* Negative margin cancels the padding, so the mark keeps its place in the
   18px nav rhythm while the tappable box grows past the glyph's 17px. */
.nav-links .gh{display:inline-flex;align-items:center;gap:5px;padding:8px;margin:-8px}
/* Mark only, no word — the same treatment the landing's top bar already
   gives its source link. The Octicon fills with currentColor so it tracks
   the nav's link colour on both palettes off one path, and the anchor's
   aria-label carries the accessible name the dropped word used to give it. */
.nav-links .gh svg{width:17px;height:17px;display:block}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
  border-radius:9px;border:1px solid var(--line-strong);background:var(--bg-panel);color:var(--ink-dim);
  cursor:pointer;transition:.15s;flex:none}
.icon-btn:hover{color:var(--ink);border-color:var(--accent-1)}
.icon-btn svg{width:16px;height:16px}
#theme-toggle .i-moon{display:none}
:root[data-theme="light"] #theme-toggle .i-sun{display:none}
:root[data-theme="light"] #theme-toggle .i-moon{display:block}
.menu-btn{display:none;font-family:var(--font-mono);font-size:13px;color:var(--ink-dim);
  background:var(--bg-panel);border:1px solid var(--line-strong);border-radius:8px;
  padding:7px 12px;cursor:pointer;align-items:center;gap:7px}
.menu-btn:hover{color:var(--ink);border-color:var(--accent-1)}

/* Shell: sidebar | main | on-page TOC */
.shell{max-width:var(--container);margin:0 auto;padding:30px clamp(18px,4vw,40px) 80px;
  display:grid;grid-template-columns:252px minmax(0,1fr) 216px;gap:38px;align-items:start}
@media(max-width:1180px){.shell{grid-template-columns:238px minmax(0,1fr);gap:30px}.toc-rail{display:none}}
@media(max-width:860px){.shell{grid-template-columns:1fr;gap:16px;padding-top:18px}}

/* Sidebar */
.sidebar{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow-y:auto;
  border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg-panel);
  padding:14px;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.sidebar::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px}
.sidebar-head{padding:6px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:10px}
.sidebar-head .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent-1-aa)}
.sidebar-head h3{font-size:16px;color:var(--ink);letter-spacing:-.01em;margin-top:4px}

/* Search */
.search{position:relative;margin-bottom:12px}
.search input{width:100%;font-family:var(--font-sans);font-size:13.5px;color:var(--ink);
  background:var(--bg-0);border:1px solid var(--line-strong);border-radius:9px;
  padding:9px 34px 9px 32px;outline:none;transition:.15s}
.search input::placeholder{color:var(--ink-faint)}
.search input:focus{border-color:var(--accent-1)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-faint);pointer-events:none}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--font-mono);font-size:12px;
  color:var(--ink-faint);border:1px solid var(--line-strong);border-radius:4px;padding:2px 5px;background:var(--bg-panel);pointer-events:none}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;background:var(--bg-panel);
  border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 20px 50px -18px rgba(0,0,0,.5);
  max-height:56vh;overflow-y:auto;padding:5px;display:none}
.search-results.open{display:block}
.search-results a{display:block;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--ink)}
.search-results a small{display:block;font-family:var(--font-mono);font-size:12px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--accent-1-aa);margin-bottom:2px}
.search-results a em{font-style:normal;color:var(--ink-faint);font-size:12px;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.search-results a:hover,.search-results a.sel{background:var(--accent-soft)}
.search-results .none{padding:10px;color:var(--ink-faint);font-size:13px}

.sidebar .grp{border:none;background:none;padding:0}
.sidebar .grp-h{width:100%;display:flex;align-items:center;gap:6px;font-family:var(--font-mono);
  font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-faint);
  padding:12px 8px 6px;background:none;border:none;cursor:pointer}
.sidebar .grp:first-of-type .grp-h{padding-top:2px}
.sidebar .grp-h svg{width:10px;height:10px;transition:transform .15s;flex:none}
.sidebar .grp.collapsed .grp-h svg{transform:rotate(-90deg)}
.sidebar .grp.collapsed .grp-items{display:none}
.sidebar a.doc-link{display:block;font-size:14px;color:var(--ink-dim);padding:7px 10px;
  border-radius:8px;letter-spacing:-.005em;line-height:1.4;border-left:2px solid transparent}
.sidebar a.doc-link:hover{background:var(--accent-soft);color:var(--ink)}
.sidebar a.doc-link.active{background:var(--accent-soft);color:var(--ink);border-left-color:var(--accent-1)}

/* Content */
.main{min-width:0}
.crumb{font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.12em;
  color:var(--ink-faint);margin-bottom:16px}
.crumb b{color:var(--accent-1-aa);font-weight:500}
.md{font-size:16px;color:var(--ink-dim)}
.md>*:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4{color:var(--ink);line-height:1.25;letter-spacing:-.02em;scroll-margin-top:84px}
.md h1{font-family:var(--font-serif);font-size:2.1rem;margin:.1em 0 .7em;padding-bottom:.4em;
  border-bottom:1px solid var(--line);letter-spacing:-.01em}
.md h2{font-family:var(--font-serif);font-size:1.5rem;margin:2rem 0 .8em;padding-bottom:.3em;
  border-bottom:1px solid var(--line);letter-spacing:-.01em}
.md h3{font-size:1.18rem;margin:1.7em 0 .6em}
.md h4{font-size:1rem;margin:1.5em 0 .5em;color:var(--ink)}
.md h1 .anchor,.md h2 .anchor,.md h3 .anchor,.md h4 .anchor{opacity:0;margin-left:.4rem;
  color:var(--accent-1);font-weight:400;text-decoration:none;font-size:.8em}
.md h1:hover .anchor,.md h2:hover .anchor,.md h3:hover .anchor,.md h4:hover .anchor{opacity:.75}
.md p,.md li{color:var(--ink-dim)}
.md p{margin:.9em 0}
.md ul,.md ol{margin:.9em 0 .9em 1.4em}
.md li{margin:.35em 0}
.md li::marker{color:var(--ink-faint)}
.md a{color:var(--accent-1-aa)}
.md a:hover{color:var(--accent-2);text-decoration:underline}
.md strong{color:var(--ink);font-weight:650}
.md em{color:var(--ink)}
.md code{font-family:var(--font-mono);font-size:.86em;background:var(--accent-soft);
  color:var(--ink);padding:.12em .42em;border-radius:5px;overflow-wrap:anywhere}
.md blockquote{margin:1.1em 0;padding:.5em 1em;border-left:3px solid var(--accent-1);
  background:var(--accent-soft);color:var(--ink-dim);border-radius:0 8px 8px 0}
.md blockquote p{margin:.3em 0;color:inherit}
.md hr{border:none;border-top:1px solid var(--line);margin:2em 0}
.md img{max-width:100%;border-radius:10px;border:1px solid var(--line);margin:1.1em 0}
.md .mermaid{background:var(--bg-panel);border:1px solid var(--line);border-radius:11px;
  padding:18px;margin:1.2em 0;text-align:center;overflow-x:auto}

/* Tables — must scroll inside their OWN frame, never the page */
.md .table-wrap{overflow-x:auto;margin:1.2em 0;border:1px solid var(--line-strong);border-radius:10px}
.md table{border-collapse:collapse;width:100%;font-size:.88rem}
.md th,.md td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top;color:var(--ink-dim);white-space:normal}
.md th{background:var(--bg-2);color:var(--ink);font-weight:600;font-family:var(--font-mono);font-size:.78rem;
  letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.md tbody tr:last-child td{border-bottom:none}

/* Code blocks — language chip + copy button, scroll inside their own frame */
.md .codeblock{position:relative;margin:1.1em 0;background:var(--code-bg);border:1px solid var(--line-strong);
  border-radius:11px;overflow:hidden}
.md .codeblock .bar{display:flex;align-items:center;gap:10px;padding:8px 13px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg-2) 60%,transparent)}
.md .codeblock .lang{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.md .codeblock .sp{flex:1}
.md .codeblock .copy{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-faint);background:var(--bg-panel);border:1px solid var(--line-strong);border-radius:999px;
  padding:4px 10px;cursor:pointer;transition:.15s}
.md .codeblock .copy:hover{color:var(--ink);border-color:var(--accent-1)}
.md .codeblock .copy.done{color:var(--teal);border-color:var(--teal)}
.md .codeblock pre{margin:0;padding:14px 16px;overflow-x:auto}
.md .codeblock pre code{background:none;color:var(--ink-dim);padding:0;font-size:.82rem;line-height:1.7;white-space:pre}

/* highlight.js — Aurora Indigo token colours, dark + light */
.hljs-comment,.hljs-quote{color:var(--ink-faint);font-style:italic}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-section,.hljs-doctag,.hljs-name,.hljs-type{color:var(--violet)}
.hljs-string,.hljs-regexp,.hljs-addition{color:var(--teal)}
.hljs-number,.hljs-symbol,.hljs-bullet{color:var(--warn)}
.hljs-attr,.hljs-attribute,.hljs-variable,.hljs-template-variable,.hljs-selector-attr,.hljs-selector-id,.hljs-selector-class{color:var(--good)}
.hljs-title,.hljs-title.function_,.hljs-built_in{color:var(--accent-1-aa)}
.hljs-meta,.hljs-meta .hljs-keyword{color:var(--ink-dim)}
.hljs-deletion{color:var(--bad)}
.hljs-emphasis{font-style:italic}.hljs-strong{font-weight:600}

.err{font-family:var(--font-mono);font-size:.85rem;color:#ffb3a6;background:rgba(224,80,60,.08);
  border:1px solid rgba(224,80,60,.25);padding:14px 16px;border-radius:10px}
.loading{font-family:var(--font-mono);font-size:.82rem;color:var(--ink-faint)}
.skeleton{display:grid;gap:12px;max-width:70ch}
.skeleton i{display:block;height:13px;border-radius:6px;background:linear-gradient(90deg,var(--bg-panel),var(--bg-2),var(--bg-panel));
  background-size:220% 100%;animation:sk 1.3s linear infinite;font-style:normal}
.skeleton i:nth-child(1){width:42%;height:26px}
.skeleton i:nth-child(3){width:86%}
.skeleton i:nth-child(4){width:70%}
@keyframes sk{from{background-position:120% 0}to{background-position:-120% 0}}

/* On-page TOC + scroll spy */
.toc-rail{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow-y:auto;font-size:13px}
.toc-rail .label{font-family:var(--font-mono);font-size:12px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:10px}
.toc-rail a{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  padding:5px 0 5px 13px;color:var(--ink-faint);border-left:1.5px solid var(--line);transition:.15s;line-height:1.4}
.toc-rail a.lvl3{padding-left:24px;font-size:12.4px}
.toc-rail a:hover{color:var(--ink);border-color:var(--line-strong)}
.toc-rail a.active{color:var(--accent-1-aa);border-color:var(--accent-1);font-weight:600}

/* Prev/next pager */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:56px;padding-top:26px;border-top:1px solid var(--line)}
@media(max-width:600px){.pager{grid-template-columns:1fr}}
.pager a{border:1px solid var(--line-strong);background:var(--bg-panel);border-radius:12px;padding:14px 16px;transition:.15s}
.pager a:hover{border-color:var(--accent-1)}
.pager a span{display:block;font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:5px}
.pager a b{font-family:var(--font-serif);font-size:17px;font-weight:600;color:var(--ink)}
.pager a.next{text-align:right;grid-column:2}
@media(max-width:600px){.pager a.next{grid-column:1}}

/* Scrim (mobile drawer backdrop) */
.scrim{display:none;position:fixed;inset:0;z-index:70;background:rgba(4,6,10,.55)}
.scrim.open{display:block}

/* Footer */
.site-footer{border-top:1px solid var(--line);padding:34px 0;margin-top:20px}
.footer-inner{max-width:var(--container);margin:0 auto;padding:0 clamp(18px,4vw,40px);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
.footer-left{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-faint)}
.footer-left img{width:20px;height:20px;opacity:.85}
.footer-links{display:flex;gap:22px;flex-wrap:wrap}
.footer-links a{font-size:13.5px;color:var(--ink-faint)}
.footer-links a:hover{color:var(--ink-dim)}

/* Mobile/tablet legibility + AA-contrast pass — scoped to <1280px so the
   >=1280px desktop view is unchanged. */
@media(max-width:1279px){
  .vulos-back,.sidebar .grp-h,.crumb{ color:var(--ink-dim) }
  .sidebar-head .eyebrow,.crumb b{ color:var(--accent-1-aa) }
}

@media(max-width:860px){
  .nav-links{display:none}
  .menu-btn{display:inline-flex}
  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:75;width:min(320px,86vw);
    max-height:none;border-radius:0;border-left:none;border-top:none;border-bottom:none;
    transform:translateX(-102%);transition:transform .22s ease}
  .sidebar.open{transform:translateX(0)}
  .md h1{font-size:1.65rem}
  .md h2{font-size:1.3rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}

  /* ── Vulos suite chrome — identical on every product landing ───────────────
     Two elements, and only two: a logo-only home button in the top bar, and
     one line in the footer. Deliberately free of repo variables so the block
     is byte-identical across the suite and can be diffed as one thing. */
  .vulos-home { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 9px; flex: 0 0 auto; opacity: .72; transition: opacity .15s ease, transform .15s ease; }
  .vulos-home:hover, .vulos-home:focus-visible { opacity: 1; transform: translateY(-1px); }
  .vulos-home img { display: block; width: 22px; height: 22px; border-radius: 6px; }
  .vulos-foot { display: inline-flex; align-items: center; gap: 9px; font-size: 13.5px; line-height: 1.45; text-decoration: none; color: inherit; opacity: .85; transition: opacity .15s ease; }
  .vulos-foot:hover { opacity: 1; text-decoration: none; }
  .vulos-foot img { display: block; width: 18px; height: 18px; border-radius: 5px; flex: 0 0 auto; }

  /* Dark-ground correction for the mark above. vulos-logo.png is flat #2E383A
     on transparency — ink drawn for paper — so composited on this surface it
     measures about 1.3:1 and reads as a smudge, not as a dimmed logo. The
     artwork carries its whole shape in the alpha channel, so brightness(0)
     invert(1) recolours it to the surface's foreground with the glyph intact,
     and the opacity holds it at the same secondary weight the light theme
     gives it. Styling only: the chrome markup stays byte-identical suite-wide. */
  :root:not([data-theme="light"]) .vulos-home img,
  :root:not([data-theme="light"]) .vulos-foot img { filter: brightness(0) invert(1); opacity: .66; }
</style>
<script src="assets/vendor/marked.umd.js"></script>
<script src="assets/vendor/mermaid.min.js"></script>
<script src="assets/vendor/highlight.min.js"></script>
</head>

<div class="shell">

<script>
// The site is served statically; docs render from this repo's own site/docs/*.md — generated
// from docs/*.md by scripts/sync-site-docs.mjs (docs/ is the single source of truth; never hand-
// edit site/docs/*.md). Cross-links between docs are pre-rewritten by that script into in-app
// "#slug" / "#slug#anchor" hash routes, so this page's own runtime link handling only needs to
// cover the rare raw ".md" reference the generator's regex didn't catch, plus decorating every
// external link with target=_blank.
const REPO_BLOB_BASE = 'https://github.com/vul-os/envoir/blob/main/';

// Sidebar order == reading order == the order scripts/sync-site-docs.mjs's own PAGES declares.
// Keep the two in lockstep: a doc missing from either is either unreachable from the viewer
// (an "unlinked chapter") or 404s when clicked.
const GROUPS = [
  {label:'Start here', items:[
    {slug:'overview',            title:'Overview'},
    {slug:'why-different',       title:"Why Envoir is different"},
    {slug:'getting-started',     title:'Getting started'},
    {slug:'identity',            title:'Your identity & safety numbers'},
  ]},
  {label:'Using Envoir', items:[
    {slug:'mail',                 title:'Mail'},
    {slug:'compose',              title:'Compose & send'},
    {slug:'chat',                 title:'Chat'},
    {slug:'calendar',             title:'Calendar'},
    {slug:'contacts',             title:'Contacts'},
    {slug:'files',                title:'Files & sharing'},
    {slug:'groups',               title:'Groups'},
    {slug:'settings',             title:'Settings & devices'},
  ]},
  {label:'Understanding it', items:[
    {slug:'naming',                  title:'Naming'},
    {slug:'transport-traceability',  title:'Transport & provenance'},
    {slug:'privacy',                 title:'Privacy & threat model'},
    {slug:'security',                title:'Security'},
  ]},
  {label:'Advanced', items:[
    {slug:'architecture',        title:'Architecture'},
    {slug:'protocol',            title:'Protocol / DMTAP internals'},
    {slug:'self-hosting',        title:'Self-hosting a node'},
    {slug:'running-the-gateway', title:'Running the gateway'},
    {slug:'client-setup',        title:'JMAP/IMAP/CalDAV client setup'},
    {slug:'pwa-and-push',        title:'PWA & push'},
    {slug:'contributing',        title:'Contributing'},
    {slug:'roadmap',             title:'Roadmap'},
    {slug:'faq',                 title:'FAQ'},
  ]},
];
const DOCS = GROUPS.flatMap(g => g.items.map(d => ({...d, group: g.label})));
const bySlug = Object.fromEntries(DOCS.map(d => [d.slug, d]));
const byFile = Object.fromEntries(DOCS.map(d => [d.slug + '.md', d]));

const content = document.getElementById('content');
const crumb = document.getElementById('crumb');
const sidebar = document.getElementById('sidebar');
const sidebarNav = document.getElementById('sidebar-nav');
const scrim = document.getElementById('scrim');
const menuBtn = document.getElementById('menuBtn');
const pager = document.getElementById('pager');
const tocRail = document.getElementById('tocRail');
const cache = new Map();

// ---------------- theme (shared with index.html: same key, same event) ----------------
const THEME_KEY = 'envoir-theme';
function isDark(){ return document.documentElement.getAttribute('data-theme') !== 'light'; }
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try { window.dispatchEvent(new Event('envoir:theme-changed')); } catch(e){}
}
function storedTheme(){
  try { const v = localStorage.getItem(THEME_KEY); return (v === 'light' || v === 'dark') ? v : null; }
  catch(e){ return null; }
}
function systemTheme(){
  try { return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
  catch(e){ return 'dark'; }
}
(function initTheme(){
  // Explicit choice wins; otherwise follow the OS. (The head script already resolved this
  // before paint — re-running it here keeps the toggle's aria state in sync.)
  applyTheme(storedTheme() || systemTheme());
  // Keep following the system while the visitor has made no explicit choice.
  try {
    const mq = matchMedia('(prefers-color-scheme: light)');
    const onChange = () => { if (!storedTheme()) applyTheme(systemTheme()); };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  } catch(e){}
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch(e){}
  });
})();

// ---------------- sidebar: grouped + collapsible ----------------
const COLLAPSE_KEY = 'envoir-docs-collapsed-groups';
function collapsedSet(){
  try { return new Set(JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '[]')); } catch(e){ return new Set(); }
}
function saveCollapsed(set){
  try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...set])); } catch(e){}
}
const collapsed = collapsedSet();
GROUPS.forEach(g => {
  const grp = document.createElement('div');
  grp.className = 'grp' + (collapsed.has(g.label) ? ' collapsed' : '');
  grp.innerHTML = '<button class="grp-h" type="button" aria-expanded="' + (!collapsed.has(g.label)) + '">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>' +
    g.label + '</button><div class="grp-items"></div>';
  const itemsEl = grp.querySelector('.grp-items');
  g.items.forEach(d => {
    const a = document.createElement('a');
    a.className = 'doc-link'; a.dataset.slug = d.slug; a.href = '#' + d.slug; a.textContent = d.title;
    itemsEl.appendChild(a);
  });
  grp.querySelector('.grp-h').addEventListener('click', () => {
    const on = grp.classList.toggle('collapsed');
    grp.querySelector('.grp-h').setAttribute('aria-expanded', String(!on));
    if (on) collapsed.add(g.label); else collapsed.delete(g.label);
    saveCollapsed(collapsed);
  });
  sidebarNav.appendChild(grp);
});

function setActive(slug){
  sidebarNav.querySelectorAll('a.doc-link').forEach(a => a.classList.toggle('active', a.dataset.slug === slug));
  const on = sidebarNav.querySelector('a.doc-link.active');
  if (on){
    // Auto-expand the group containing the active page, so it's never hidden by a collapsed group.
    const grp = on.closest('.grp');
    if (grp && grp.classList.contains('collapsed')) {
      grp.classList.remove('collapsed');
      grp.querySelector('.grp-h').setAttribute('aria-expanded', 'true');
    }
    if (sidebar.scrollHeight > sidebar.clientHeight){
      const r = on.getBoundingClientRect(), sr = sidebar.getBoundingClientRect();
      if (r.top < sr.top || r.bottom > sr.bottom) on.scrollIntoView({ block:'center' });
    }
  }
}

// ---------------- markdown setup ----------------
let mermaidReady = false;
try {
  mermaid.initialize({ startOnLoad:false, theme: isDark() ? 'dark' : 'base', securityLevel:'loose',
    themeVariables:{ fontFamily:'var(--font-sans)', primaryColor: isDark() ? '#171524' : '#e8e3f5',
      primaryTextColor: isDark() ? '#ecebf6' : '#16132e', primaryBorderColor:'#4C4DFF',
      lineColor: isDark() ? '#736e91' : '#83809b', secondaryColor: isDark() ? '#1c1930' : '#efe9fb' } });
  mermaidReady = true;
} catch(e){}

if (window.marked && marked.setOptions) marked.setOptions({ gfm:true, breaks:false });

// GitHub-compatible heading slugs (does NOT collapse consecutive hyphens FROM EXISTING literal
// hyphens in the heading text — it only ever collapses a RUN OF WHITESPACE to one hyphen), so the
// hand-written "#naming-key-transparency"-style fragments in the source docs resolve correctly.
function slugifyHeading(t){
  return t.toLowerCase().trim().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-');
}

// ---- image theme-swap: a single markdown ![]() reference follows the active theme ----
// Mirrors site/js/main.js's own theme-aware-screenshot convention (same localStorage key,
// same envoir:theme-changed event) but operates on plain <img src> rather than <picture>,
// since markdown can't express <picture> — this rewrites the src directly instead.
//
// Handles path-graph's irregular naming (the dark shot kept its pre-existing suffix-less
// filename, "path-graph.png", not "path-graph-dark.png") via an explicit exception map, and
// leaves dark-only shots (onboarding-safety.png, onboarding-identity.png — no theme toggle
// exists during onboarding, so no light variant was ever generated) untouched: neither matches
// the -dark/-light suffix pattern nor the exception map, so they fall through unchanged.
const IRREGULAR_DARK_TO_LIGHT = { 'path-graph.png': 'path-graph-light.png' };
const IRREGULAR_LIGHT_TO_DARK = Object.fromEntries(Object.entries(IRREGULAR_DARK_TO_LIGHT).map(([d,l]) => [l,d]));
function themeVariant(src, dark){
  const slash = src.lastIndexOf('/');
  const dir = slash >= 0 ? src.slice(0, slash + 1) : '';
  const file = slash >= 0 ? src.slice(slash + 1) : src;
  if (IRREGULAR_DARK_TO_LIGHT[file]) return dir + (dark ? file : IRREGULAR_DARK_TO_LIGHT[file]);
  if (IRREGULAR_LIGHT_TO_DARK[file]) return dir + (dark ? IRREGULAR_LIGHT_TO_DARK[file] : file);
  let m = file.match(/^(.*)-dark\.png$/i);
  if (m) return dir + (dark ? file : m[1] + '-light.png');
  m = file.match(/^(.*)-light\.png$/i);
  if (m) return dir + (dark ? m[1] + '-dark.png' : file);
  return src; // no known pair (e.g. a dark-only onboarding shot) — leave untouched
}
function applyImageTheme(){
  const dark = isDark();
  content.querySelectorAll('img').forEach(img => {
    const cur = img.getAttribute('src') || '';
    if (/^https?:/i.test(cur)) return;
    const next = themeVariant(cur, dark);
    if (next !== cur) img.setAttribute('src', next);
  });
}
window.addEventListener('envoir:theme-changed', () => {
  applyImageTheme();
  if (content.querySelector('.mermaid')) rerenderMermaidForTheme();
  try {
    mermaid.initialize({ startOnLoad:false, theme: isDark() ? 'dark' : 'base', securityLevel:'loose',
      themeVariables:{ fontFamily:'var(--font-sans)' } });
  } catch(e){}
});
function rerenderMermaidForTheme(){
  // Mermaid bakes its theme into rendered SVGs at run() time; re-run against the raw source
  // kept in each node's data-src so a theme flip repaints diagrams instead of leaving stale
  // colours from the previous theme.
  const nodes = content.querySelectorAll('.mermaid[data-src]');
  nodes.forEach(n => { n.removeAttribute('data-processed'); n.textContent = n.getAttribute('data-src'); });
  if (nodes.length && mermaidReady) { try { mermaid.run({ nodes }); } catch(e){} }
}

async function renderMermaid(){
  if(!mermaidReady) return;
  content.querySelectorAll('code.language-mermaid').forEach(code => {
    const div = document.createElement('div'); div.className = 'mermaid';
    div.setAttribute('data-src', code.textContent);
    div.textContent = code.textContent; code.closest('pre').replaceWith(div);
  });
  const nodes = content.querySelectorAll('.mermaid');
  if(nodes.length){ try { await mermaid.run({ nodes }); } catch(e){ console.warn('mermaid', e); } }
}

// ---- code blocks: language chip, copy button, highlight.js (never breaks the page) ----
function enhanceCodeBlocks(){
  content.querySelectorAll('pre > code').forEach(code => {
    const pre = code.parentElement;
    if (code.classList.contains('language-mermaid')) return; // handled by renderMermaid
    const cls = [...code.classList].find(c => c.startsWith('language-')) || '';
    const lang = cls.replace('language-', '').toLowerCase();
    const box = document.createElement('div');
    box.className = 'codeblock';
    const known = lang && window.hljs && hljs.getLanguage(lang);
    box.innerHTML = '<div class="bar"><span class="lang">' + (lang || 'text') + '</span>' +
      '<span class="sp"></span><button class="copy" type="button">Copy</button></div>';
    pre.replaceWith(box);
    box.appendChild(pre);
    if (window.hljs) {
      try { if (known) hljs.highlightElement(code); }
      catch(e) { /* an unknown/misdetected language leaves the block unhighlighted, not broken */ }
    }
  });
  content.querySelectorAll('.copy').forEach(btn => btn.addEventListener('click', async () => {
    const code = btn.closest('.codeblock').querySelector('code');
    try {
      await navigator.clipboard.writeText(code.innerText);
      btn.textContent = 'Copied'; btn.classList.add('done');
    } catch(e) { btn.textContent = 'Ctrl/Cmd+C'; }
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1600);
  }));
}

function wrapTables(){
  content.querySelectorAll('table').forEach(t => {
    const w = document.createElement('div'); w.className = 'table-wrap';
    t.replaceWith(w); w.appendChild(t);
  });
}

// ---- on-page TOC + scroll-spy ----
let spy = null;
function buildToc(){
  if (spy) { spy.disconnect(); spy = null; }
  const heads = [...content.querySelectorAll('h2, h3')];
  if (heads.length < 2) { tocRail.innerHTML = ''; return; }
  const toc = heads.map(h => ({ id:h.id, text:h.textContent.replace(/#$/, '').trim(), level: h.tagName === 'H3' ? 3 : 2 }));
  tocRail.innerHTML = '<div class="label">On this page</div>' + toc.map(t =>
    '<a href="#' + t.id + '" data-id="' + t.id + '"' + (t.level === 3 ? ' class="lvl3"' : '') + '>' +
    t.text.replace(/</g,'&lt;') + '</a>').join('');
  tocRail.querySelectorAll('a').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    document.getElementById(a.dataset.id)?.scrollIntoView({ behavior:'smooth', block:'start' });
  }));
  const links = Object.fromEntries([...tocRail.querySelectorAll('a')].map(a => [a.dataset.id, a]));
  const visible = new Set();
  spy = new IntersectionObserver(entries => {
    entries.forEach(e => e.isIntersecting ? visible.add(e.target.id) : visible.delete(e.target.id));
    const first = toc.map(t => t.id).find(id => visible.has(id));
    if (!first) return;
    Object.values(links).forEach(a => a.classList.remove('active'));
    links[first]?.classList.add('active');
  }, { rootMargin:'-90px 0px -70% 0px' });
  toc.forEach(t => { const el = document.getElementById(t.id); if (el) spy.observe(el); });
}

function buildPager(slug){
  const i = DOCS.findIndex(d => d.slug === slug);
  const prev = DOCS[i - 1], next = DOCS[i + 1];
  pager.innerHTML =
    (prev ? '<a href="#' + prev.slug + '"><span>&larr; Previous</span><b>' + prev.title + '</b></a>' : '<span></span>') +
    (next ? '<a class="next" href="#' + next.slug + '"><span>Next &rarr;</span><b>' + next.title + '</b></a>' : '');
}

async function fetchDoc(doc){
  if (cache.has(doc.slug)) return cache.get(doc.slug);
  const res = await fetch('docs/' + doc.slug + '.md', { cache:'no-cache' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const md = await res.text();
  cache.set(doc.slug, md);
  return md;
}

async function load(slug, heading){
  const doc = bySlug[slug] || DOCS[0];
  setActive(doc.slug);
  crumb.innerHTML = 'Docs <span style="opacity:.5">/</span> <b>' + doc.title + '</b>';
  document.title = 'Envoir — ' + doc.title;
  content.innerHTML = '<div class="skeleton"><i></i><i></i><i></i><i></i></div>';
  buildPager(doc.slug);
  try {
    const md = await fetchDoc(doc);
    content.innerHTML = marked.parse(md);

    // Cross-doc links are already rewritten to "#slug"/"#slug#anchor" by sync-site-docs.mjs.
    // This is a defensive second pass only, for any raw ".md" reference that slipped through
    // (there should be none) — anything not one of our own docs resolves to its real GitHub
    // location, so no link this page renders is ever dead.
    content.querySelectorAll('a[href]').forEach(a => {
      const h = a.getAttribute('href') || '';
      if (/^(https?:|#|mailto:)/i.test(h)) return;
      const m = h.match(/([A-Za-z0-9._-]+)\.md(#.*)?$/i);
      const target = m && byFile[m[1].toLowerCase() + '.md'];
      if (target) { a.setAttribute('href', '#' + target.slug + (m[2] ? '#' + m[2].slice(1) : '')); return; }
      const clean = h.replace(/^(\.\.?\/)+/, '');
      a.setAttribute('href', REPO_BLOB_BASE + clean);
      a.target = '_blank'; a.rel = 'noopener';
    });
    content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });

    // heading anchor ids + hover "#" links (GitHub-compatible slugs)
    const seen = {};
    content.querySelectorAll('h1,h2,h3,h4').forEach(h => {
      let id = slugifyHeading(h.textContent);
      if(!id) return;
      if(seen[id] != null){ seen[id]++; id = id + '-' + seen[id]; } else seen[id] = 0;
      h.id = id;
      const a = document.createElement('a');
      a.className = 'anchor'; a.href = '#' + doc.slug + '#' + id; a.textContent = '#';
      a.setAttribute('aria-label', 'Link to this section');
      h.appendChild(a);
    });

    applyImageTheme();
    wrapTables();
    enhanceCodeBlocks();
    await renderMermaid();
    buildToc();

    if(heading){
      const el = document.getElementById(heading);
      if(el){ el.scrollIntoView(); return; }
    }
    window.scrollTo({ top:0 });
  } catch(err){
    content.innerHTML = '<div class="err">Could not load <code>' + doc.slug + '.md</code> — ' + err.message + '</div>';
    tocRail.innerHTML = '';
  }
}

function closeDrawer(){ sidebar.classList.remove('open'); scrim.classList.remove('open'); menuBtn.setAttribute('aria-expanded','false'); }

function route(){
  const raw = (location.hash || '').replace(/^#/, '');
  const parts = raw.split('#');
  const slug = parts[0] || DOCS[0].slug;
  if(bySlug[slug]){
    load(slug, parts[1]);
  } else if(raw){
    const el = document.getElementById(raw);
    if(el) el.scrollIntoView(); else load(DOCS[0].slug);
  } else {
    load(DOCS[0].slug);
  }
  if(window.matchMedia('(max-width:860px)').matches) closeDrawer();
}

window.addEventListener('hashchange', route);
route();

menuBtn.addEventListener('click', () => {
  const open = !sidebar.classList.contains('open');
  sidebar.classList.toggle('open', open); scrim.classList.toggle('open', open);
  menuBtn.setAttribute('aria-expanded', String(open));
});
scrim.addEventListener('click', closeDrawer);

// ---------------- client-side search across every doc, no dependency ----------------
const searchInput = document.getElementById('docsearch');
const searchResults = document.getElementById('search-results');
let searchIndex = null, searchSel = -1;

async function buildSearchIndex(){
  if (searchIndex) return searchIndex;
  const all = await Promise.all(DOCS.map(async d => {
    let md = '';
    try { md = await fetchDoc(d); } catch(e) { return []; }
    const out = [];
    let heading = d.title, hid = '', fence = false;
    md.split('\n').forEach(line => {
      if (/^```/.test(line)) { fence = !fence; return; }
      if (fence) return;
      if (/^<!--/.test(line.trim())) return; // the GENERATED-file banner
      const h = line.match(/^(#{1,4})\s+(.*)$/);
      if (h) {
        heading = h[2].replace(/[`*]/g, '').trim();
        hid = h[1].length > 1 ? slugifyHeading(heading) : '';
        out.push({ doc:d, heading, hid, text:'' });
        return;
      }
      let t = line.trim();
      if (!t || /^[|>\-=*]/.test(t)) return;
      // Collapse a markdown link to just its visible text ("[safety number](#foo#bar)" ->
      // "safety number") before stripping remaining markup — otherwise the link's target
      // (an in-app "#slug#anchor" hash route after sync-site-docs.mjs's rewrite) leaks into
      // the search-result preview as unreadable trailing text.
      t = t.replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[`*_[\]()]/g, '');
      const last = out[out.length - 1];
      if (last && last.text.length < 190) last.text += (last.text ? ' ' : '') + t;
    });
    return out;
  }));
  searchIndex = all.flat();
  return searchIndex;
}

function renderSearchResults(items, term){
  searchSel = -1;
  if (!items.length){
    searchResults.innerHTML = '<div class="none">Nothing matches "' + term.replace(/</g,'&lt;') + '".</div>';
  } else {
    searchResults.innerHTML = items.slice(0, 12).map(it =>
      '<a href="#' + it.doc.slug + (it.hid ? '#' + it.hid : '') + '" role="option">' +
      '<small>' + it.doc.title + '</small>' + (it.heading || '').replace(/</g,'&lt;') +
      (it.text ? '<em>' + it.text.slice(0, 100).replace(/</g,'&lt;') + '…</em>' : '') + '</a>').join('');
  }
  searchResults.classList.add('open');
}

let searchTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const term = searchInput.value.trim();
  if (term.length < 2) { searchResults.classList.remove('open'); return; }
  searchTimer = setTimeout(async () => {
    const idx = await buildSearchIndex();
    const words = term.toLowerCase().split(/\s+/);
    const scored = idx.map(it => {
      const hay = (it.heading + ' ' + it.text).toLowerCase();
      let score = 0;
      words.forEach(w => { if (it.heading.toLowerCase().includes(w)) score += 10; if (hay.includes(w)) score += 3; });
      return { it, score };
    }).filter(s => s.score > 0).sort((a,b) => b.score - a.score).map(s => s.it);
    renderSearchResults(scored, term);
  }, 110);
});
searchInput.addEventListener('keydown', e => {
  const opts = [...searchResults.querySelectorAll('a')];
  if (e.key === 'Escape') { searchResults.classList.remove('open'); searchInput.blur(); return; }
  if (!opts.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    searchSel = (searchSel + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length;
    opts.forEach(o => o.classList.remove('sel'));
    opts[searchSel].classList.add('sel');
    opts[searchSel].scrollIntoView({ block:'nearest' });
  } else if (e.key === 'Enter' && searchSel >= 0){
    e.preventDefault();
    location.hash = opts[searchSel].getAttribute('href').slice(1);
    searchResults.classList.remove('open'); searchInput.blur();
  }
});
searchResults.addEventListener('click', () => { searchResults.classList.remove('open'); searchInput.blur(); });
document.addEventListener('click', e => { if (!e.target.closest('.search')) searchResults.classList.remove('open'); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault();
    if (window.matchMedia('(max-width:860px)').matches) { sidebar.classList.add('open'); scrim.classList.add('open'); menuBtn.setAttribute('aria-expanded','true'); }
    searchInput.focus();
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    if (window.matchMedia('(max-width:860px)').matches) { sidebar.classList.add('open'); scrim.classList.add('open'); }
    searchInput.focus(); searchInput.select();
  }
});
</script>
</body>
